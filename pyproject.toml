[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomodeling-unified"
version = "0.1.0"
description = "Unified evidence-grounded literature extraction and biological model simulation pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.8.0",
    "numpy>=2.2.6",
    "scipy>=1.15.2",
    "matplotlib<3.10; python_version < '3.14'",
    "matplotlib>=3.11; python_version >= '3.14'",
    "sympy>=1.14.0",
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://github.com/FrostingMaple/Biomodeling"
Repository = "https://github.com/FrostingMaple/Biomodeling"

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11", "pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
biomodeling = "biomodeling.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"biomodeling.literature" = [
    "lexicons/*",
    "prompts/*",
    "templates/*",
]
"biomodeling.contracts" = ["*.json"]

